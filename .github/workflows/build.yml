name: Compilar APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Compilar
        run: gradle assembleRelease --no-daemon

      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk EditorNegocio.apk

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: EditorNegocio-apk
          path: EditorNegocio.apk

      # Publica el APK en "Releases" para descargarlo directo desde el celular
      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Editor Negocio (versión ${{ github.run_number }})
          files: EditorNegocio.apk
